<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-dark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VMC Portal" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Customer portal for calibration records and gauge status tracking"
    />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Vikramaditya Metrology Center</title>
  </head>
  <body>
    <div id="root">
      <div id="app-boot-fallback" style="align-items:center;background:#f8fafc;color:#1e293b;display:flex;flex-direction:column;font-family:system-ui,sans-serif;gap:12px;justify-content:center;min-height:100vh;padding:24px;text-align:center">
        <div aria-hidden="true" style="border:3px solid #dbeafe;border-radius:999px;border-top-color:#2563eb;height:32px;width:32px"></div>
        <p style="margin:0">Loading application...</p>
        <button id="app-boot-reload" type="button" onclick="window.location.reload()" style="background:#2563eb;border:0;border-radius:6px;color:#fff;cursor:pointer;display:none;font:inherit;padding:10px 16px">Reload</button>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.setTimeout(function () {
        var reloadButton = document.getElementById('app-boot-reload');
        if (reloadButton && document.getElementById('app-boot-fallback')) {
          reloadButton.style.display = 'inline-block';
        }
      }, 8000);
    </script>
  </body>
</html>
