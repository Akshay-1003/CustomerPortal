version: "3.9"

services:
  frontend:
    container_name: cportal-vacl
    build:
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    volumes:
      # Enable hot reload (important for dev)
      - .:/app
      - /app/node_modules
    # The mounted node_modules volume survives image rebuilds. Reinstall from
    # the lockfile before Vite starts so new shadcn/Radix dependencies resolve.
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host --port 5174"
    restart: unless-stopped
