services:
  frontend:
    container_name: cportal-vacl
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://api.metrologydesk.com/api/v1}
        VITE_API_REQUEST_TIMEOUT_MS: ${VITE_API_REQUEST_TIMEOUT_MS:-20000}
    ports:
      - "${HOST_PORT:-5174}:80"
    restart: unless-stopped
